(async()=>{'use strict';const url='https://gmdpfgabpkizwfgwzfgf.supabase.co', key='sb_publishable_iF4TUE-mwy1GeGsWOaw4TA_LBQgc_ad';const $=s=>document.getElementById(s), status=$('status');const params=new URLSearchParams(location.hash.slice(1));const token=params.get('access_token'), type=params.get('type');history.replaceState(null,'',location.pathname);if(!token||!['recovery','invite'].includes(type)){status.textContent='Abre el enlace más reciente recibido por correo para establecer tu contraseña.';return}const headers={apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'};try{const r=await fetch(url+'/auth/v1/user',{headers,cache:'no-store'});const user=await r.json();if(!r.ok||user.id!=='dfe542f8-df61-4c5f-8b64-098c27070777')throw Error('El enlace es inválido, venció o corresponde a otra cuenta.');status.textContent='Enlace válido. Crea una contraseña exclusiva para Clinicpartes.';$('form').classList.remove('hidden')}catch(e){status.textContent='No se pudo verificar el enlace. '+e.message;return}$('form').addEventListener('submit',async e=>{e.preventDefault();if($('password').value!==$('confirm').value){status.textContent='Las contraseñas no coinciden.';return}$('save').disabled=true;try{const r=await fetch(url+'/auth/v1/user',{method:'PUT',headers,body:JSON.stringify({password:$('password').value}),cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.msg||data.message||'No se pudo guardar.');$('password').value='';$('confirm').value='';$('form').classList.add('hidden');status.textContent='Contraseña guardada. Ya puedes volver a Zapia para continuar la prueba de Clinicpartes.'}catch(e){status.textContent='No se pudo guardar la contraseña: '+e.message;$('save').disabled=false}})})();
